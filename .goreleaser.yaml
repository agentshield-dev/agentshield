# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release build for the AgentShield binaries. Run by .github/workflows/release.yml on v* tags.
# Local dry run (needs syft on PATH): goreleaser release --snapshot --skip=publish,sign --clean
version: 2

project_name: agentshield

before:
  hooks:
    # agentshield embeds ui/dist, so the web UI must be built before any Go build.
    - make ui

builds:
  - id: agentshield
    main: ./cmd/agentshield
    binary: agentshield
    env: &env
      - CGO_ENABLED=0
    goos: &goos [linux, darwin]
    goarch: &goarch [amd64, arm64]
    flags: &flags [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X github.com/agentshield-dev/agentshield/internal/version.Version={{ .Version }}
      - -X github.com/agentshield-dev/agentshield/internal/version.Commit={{ .FullCommit }}
    mod_timestamp: &mod_timestamp "{{ .CommitTimestamp }}"
  - id: agentshield-reasoning-mcp
    main: ./cmd/agentshield-reasoning-mcp
    binary: agentshield-reasoning-mcp
    env: *env
    goos: *goos
    goarch: *goarch
    flags: *flags
    ldflags: *ldflags
    mod_timestamp: *mod_timestamp
  - id: agentshield-detector-rules
    main: ./cmd/agentshield-detector-rules
    binary: agentshield-detector-rules
    env: *env
    goos: *goos
    goarch: *goarch
    flags: *flags
    ldflags: *ldflags
    mod_timestamp: *mod_timestamp
  - id: agentshield-deployment-author
    main: ./cmd/agentshield-deployment-author
    binary: agentshield-deployment-author
    env: *env
    goos: *goos
    goarch: *goarch
    flags: *flags
    ldflags: *ldflags
    mod_timestamp: *mod_timestamp

archives:
  - id: agentshield
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive, generated by syft (installed by the release workflow).
sboms:
  - artifacts: archive

# Keyless cosign signature of checksums.txt, as a Sigstore bundle. It uses the workflow's OIDC
# token, so local runs need --skip=sign. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/agentshield-dev/agentshield/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  prerelease: auto
