version: 2
updates:
  # Minor and patch updates are grouped per ecosystem so a weekly run opens a few PRs, not one per
  # package. Major updates still arrive individually because they usually need code changes.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    groups:
      # Storybook, Vite, and Vitest packages depend on each other's versions and must move together.
      ui-tooling:
        patterns:
          - storybook
          - '@storybook/*'
          - vite
          - '@vitejs/*'
          - vitest
          - '@vitest/*'
          - msw
          - msw-storybook-addon
          - playwright
        update-types: [minor, patch]
      ui:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
